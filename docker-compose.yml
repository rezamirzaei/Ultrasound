services:
  app:
    build:
      context: .
      target: base
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./ui:/app/ui
    command: ["python", "-m", "ultrasound.api"]

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    command: ["pytest", "tests/", "-v", "--tb=short"]
