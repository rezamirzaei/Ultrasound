services:
  app:
    build:
      context: .
      target: base
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./ui:/app/ui
    environment:
      - PYTHONPATH=/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["python", "-m", "ultrasound.api"]

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    volumes:
      - ./data:/app/data
    command: ["pytest", "tests/", "-v", "--tb=short"]
