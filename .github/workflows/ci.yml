name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (black)
        run: python -m black --check src/ tests/ main.py scripts/

      - name: Check import ordering (isort)
        run: python -m isort --check-only src/ tests/ main.py scripts/

      - name: Type check (mypy)
        run: python -m mypy --config-file pyproject.toml

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src/ultrasound --cov-report=term-missing --cov-fail-under=40

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build --target test -t ultrasound-toolkit:test .

      - name: Run tests inside container
        run: docker run --rm ultrasound-toolkit:test
