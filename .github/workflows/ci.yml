name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Detect which areas of the repo changed ──────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'main.py'
              - 'pyproject.toml'
              - 'alembic/**'
              - 'alembic.ini'
            frontend:
              - 'ui/**'
              - 'e2e/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'pyproject.toml'
            ci:
              - '.github/workflows/**'

  # ── Python quality: lint, type-check, test ──────────────────────────
  quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Alembic migrations
        run: |
          INPHASE_DATABASE_URL=sqlite:////tmp/inphase-ci.sqlite3 alembic upgrade head

      - name: Check formatting (black)
        run: python -m black --check src/ tests/ main.py scripts/

      - name: Check import ordering (isort)
        run: python -m isort --check-only src/ tests/ main.py scripts/

      - name: Type check (mypy)
        run: python -m mypy --config-file pyproject.toml

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src/ultrasound --cov-report=term-missing --cov-fail-under=40

  # ── Build sdist / wheel ─────────────────────────────────────────────
  package:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

  # ── Docker build ────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build --target test -t ultrasound-toolkit:test .

      - name: Run tests inside container
        run: docker run --rm ultrasound-toolkit:test

  # ── Frontend-only smoke check ───────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          echo "Checking that index.html exists and is valid..."
          test -f ui/index.html
          grep -q '<html' ui/index.html
          echo "✅ Frontend files look good"
