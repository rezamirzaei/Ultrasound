[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasound-imaging-toolkit"
version = "1.0.0"
description = "Ultrasound Image Processing and Analysis Toolkit - Demonstrating signal processing, image analysis, and ML for medical ultrasound applications"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Reza Mirzaeifard", email = "reza.mirzaeifard@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
    "PyWavelets>=1.5.0",
    "scikit-learn>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "seaborn>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "httpx>=0.27.0",
    "playwright>=1.49.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "kaggle>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/rezamirzaei/ultrasound-imaging-toolkit"

[project.scripts]
ultrasound-api = "ultrasound.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/ultrasound", "tests"]
exclude = "(^notebooks/|^scripts/)"

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "e2e: browser end-to-end tests",
]

[tool.uv]
# Ensure uv resolves to versions with compatible wheels for all platforms
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
